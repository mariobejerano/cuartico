spring:
  application:
    name: cuartico
  profiles:
    default: dev
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
  flyway:
    enabled: true

server:
  # Render (y otros PaaS) indican el puerto en la variable PORT
  port: ${PORT:8080}
  error:
    include-message: always

management:
  endpoints:
    web:
      exposure:
        include: health,info

app:
  jwt:
    issuer: cuartico
    secret: ${APP_JWT_SECRET}
    access-token-ttl: 15m
    refresh-token-ttl: 7d
  cors:
    allowed-origins: ${APP_CORS_ORIGINS:http://localhost:5173}
  admin:
    # Usuario administrador inicial: solo se crea si la tabla users está vacía
    username: ${APP_ADMIN_USERNAME:}
    password: ${APP_ADMIN_PASSWORD:}
