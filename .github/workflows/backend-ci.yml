name: Backend CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]
  workflow_dispatch:

# Un push nuevo a la misma rama cancela la ejecución anterior
concurrency:
  group: backend-ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

defaults:
  run:
    working-directory: backend

jobs:
  test:
    name: Tests (${{ matrix.db }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          # H2 en modo PostgreSQL: lo mismo que en local
          - db: h2
          # PostgreSQL real: valida que las migraciones Flyway y las consultas funcionan igual que en producción (Neon)
          - db: postgres
            datasource_url: jdbc:postgresql://localhost:5432/cuartico
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: cuartico
          POSTGRES_USER: cuartico
          POSTGRES_PASSWORD: cuartico-ci-only
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U cuartico"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      # Solo para la variante postgres: sobrescribe la URL de application-test.yml.
      # Valores de un contenedor efímero del CI, no son secretos reales.
      SPRING_DATASOURCE_URL: ${{ matrix.datasource_url }}
      SPRING_DATASOURCE_USERNAME: ${{ matrix.db == 'postgres' && 'cuartico' || 'sa' }}
      SPRING_DATASOURCE_PASSWORD: ${{ matrix.db == 'postgres' && 'cuartico-ci-only' || '' }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"
          cache: maven
          cache-dependency-path: backend/pom.xml

      - name: Build and test
        run: |
          if [ -z "$SPRING_DATASOURCE_URL" ]; then unset SPRING_DATASOURCE_URL SPRING_DATASOURCE_USERNAME SPRING_DATASOURCE_PASSWORD; fi
          ./mvnw -B verify

      - name: Upload test reports
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: test-reports-${{ matrix.db }}
          path: backend/target/surefire-reports/
          retention-days: 7

  docker:
    name: Docker build
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v7

      - uses: docker/setup-buildx-action@v4

      # Solo comprueba que la imagen se construye (Render la construye y despliega por su cuenta)
      - name: Build image
        uses: docker/build-push-action@v7
        with:
          context: backend
          push: false
          tags: cuartico-api:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
