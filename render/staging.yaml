# Render Blueprint de STAGING (enlazado a la rama develop, archivo render/staging.yaml).
# Servicio cuartico-api-staging ← develop, base de datos: rama "staging" de Neon.
# Solo despliega cuando el CI pasa (autoDeployTrigger: checksPass). Secretos: "sync: false" (los introduce la supervisión en Render).

services:
  - type: web
    name: cuartico-api-staging
    runtime: docker
    plan: free
    region: virginia
    branch: develop
    dockerContext: ./backend
    dockerfilePath: ./backend/Dockerfile
    healthCheckPath: /actuator/health
    autoDeployTrigger: checksPass
    envVars:
      - key: SPRING_PROFILES_ACTIVE
        value: prod
      - key: DB_URL            # jdbc:postgresql://<host de la rama staging>/neondb?sslmode=require
        sync: false
      - key: DB_USERNAME
        sync: false
      - key: DB_PASSWORD
        sync: false
      - key: APP_JWT_SECRET
        generateValue: true
      - key: APP_ADMIN_USERNAME
        value: admin
      - key: APP_ADMIN_PASSWORD  # contraseña del primer admin; cambiarla tras el primer login
        sync: false
      - key: SPRINGDOC_ENABLED   # Swagger UI y /v3/api-docs solo en staging (en producción quedan desactivados)
        value: "true"
      - key: APP_CORS_ORIGINS   # frontend de staging (Render static site) y Vite en local
        value: https://cuartico-web-staging.onrender.com,http://localhost:5173


  # Panel cuartico-web de staging: sitio estático (gratis) ← develop.
  - type: web
    name: cuartico-web-staging
    runtime: static
    branch: develop
    rootDir: cuartico-web
    buildCommand: npm ci && npm run build
    staticPublishPath: dist
    autoDeployTrigger: checksPass
    envVars:
      - key: VITE_API_BASE_URL
        value: https://cuartico-api-staging.onrender.com
    routes:
      - type: rewrite        # SPA: toda ruta sirve index.html
        source: /*
        destination: /index.html
    headers:
      - path: /*
        name: Content-Security-Policy   # ADR-001, condición 6
        value: "default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data:; font-src 'self'; connect-src 'self' https://cuartico-api-staging.onrender.com; manifest-src 'self'; frame-ancestors 'none'; object-src 'none'; base-uri 'self'; form-action 'self'"
      - path: /*
        name: X-Content-Type-Options
        value: nosniff
      - path: /*
        name: Referrer-Policy
        value: strict-origin-when-cross-origin
